<!DOCTYPE html>
<html lang="ru" id="talk-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title>MetaPelet</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="MetaPelet">
    <meta name="theme-color" content="#43a047">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(165deg, #fff9ef 0%, #eef5f0 100%);
            min-height: 100vh;
            padding: 16px;
            color: #000;
            font-size: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        [dir="rtl"] { direction: rtl; text-align: right; }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .greeting {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 24px;
            line-height: 1.3;
        }
        
        .status {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 32px;
            min-height: 2.5em;
            line-height: 1.5;
            padding: 0 16px;
        }
        
        .btn-talk {
            width: 100%;
            font-size: 2.5rem;
            font-weight: 700;
            padding: 48px 24px;
            border-radius: 24px;
            border: 4px solid #2e7d32;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 12px 32px rgba(46, 125, 50, 0.35);
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        
        .btn-talk:active {
            transform: scale(0.97);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
            border-color: #c62828;
        }
        
        .reply-box {
            background: white;
            border: 4px solid #43a047;
            border-radius: 20px;
            padding: 32px 24px;
            margin-bottom: 24px;
            font-size: 1.8rem;
            line-height: 1.6;
            color: #000;
            text-align: center;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        
        .reply-box.visible {
            display: block;
        }
        
        .btn-replay {
            width: 100%;
            font-size: 1.6rem;
            font-weight: 600;
            padding: 28px 24px;
            border-radius: 20px;
            border: 3px solid #555;
            background: #757575;
            color: white;
            cursor: pointer;
            margin-bottom: 16px;
            display: none;
        }
        
        .btn-replay.visible {
            display: block;
        }
        
        .settings-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #ddd;
            color: #666;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.3s;
            z-index: 100;
        }
        
        [dir="rtl"] .settings-btn {
            right: auto;
            left: 12px;
        }
        
        .settings-btn:active {
            opacity: 1;
        }
        
        .error-message {
            background: #ffebee;
            border: 3px solid #e53935;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: #c62828;
            line-height: 1.5;
        }
        
        .btn-retry {
            width: 100%;
            font-size: 1.8rem;
            font-weight: 600;
            padding: 32px 24px;
            border-radius: 20px;
            border: 3px solid #1976d2;
            background: #2196f3;
            color: white;
            cursor: pointer;
            margin-top: 16px;
        }
        
        .feedback-box {
            background: white;
            border: 4px solid #43a047;
            border-radius: 20px;
            padding: 32px 24px;
            margin-top: 24px;
            display: none;
        }
        
        .feedback-box.visible {
            display: block;
        }
        
        .feedback-question {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 24px;
            text-align: center;
        }
        
        .feedback-buttons {
            display: flex;
            gap: 16px;
        }
        
        .btn-feedback {
            flex: 1;
            font-size: 2rem;
            padding: 32px 16px;
            border-radius: 16px;
            border: 3px solid #ddd;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-feedback.positive {
            border-color: #43a047;
            background: #f0f7f0;
        }
        
        .btn-feedback.positive:active {
            background: #43a047;
            color: white;
        }
        
        .btn-feedback.negative {
            border-color: #757575;
            background: #f5f5f5;
        }
        
        .btn-feedback.negative:active {
            background: #757575;
            color: white;
        }
        
        .feedback-thanks {
            font-size: 1.5rem;
            color: #2e7d32;
            text-align: center;
            padding: 24px;
        }
        
        .hidden { display: none !important; }
        
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .settings-modal.visible {
            display: flex;
        }
        
        .settings-content {
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        
        .settings-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #2d3436;
        }
        
        .btn-setting {
            width: 100%;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 20px 16px;
            border-radius: 16px;
            border: 3px solid #757575;
            background: white;
            cursor: pointer;
            margin-bottom: 16px;
        }
        
        .btn-setting.danger {
            border-color: #e53935;
            color: #e53935;
        }
        
        .btn-setting.danger:active {
            background: #e53935;
            color: white;
        }
        
        @media (max-width: 500px) {
            .greeting { font-size: 2rem; }
            .status { font-size: 1.5rem; }
            .btn-talk { font-size: 2rem; padding: 40px 20px; }
            .reply-box { font-size: 1.5rem; }
            .btn-replay { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <button type="button" class="settings-btn" id="settings-btn" title="Настройки">⚙</button>
    
    <div class="container">
        <h1 class="greeting" id="greeting">MetaPelet</h1>
        
        <div class="status" id="status"></div>
        
        <div id="error-container" class="hidden">
            <div class="error-message" id="error-message"></div>
            <button type="button" class="btn-retry" id="retry-btn"></button>
        </div>
        
        <button type="button" class="btn-talk" id="talk-btn"></button>
        
        <div class="reply-box" id="reply-box"></div>
        
        <button type="button" class="btn-replay" id="replay-btn"></button>
        
        <div class="feedback-box" id="feedback-box">
            <div class="feedback-question" id="feedback-question"></div>
            <div class="feedback-buttons">
                <button type="button" class="btn-feedback positive" id="feedback-yes">👍</button>
                <button type="button" class="btn-feedback negative" id="feedback-no">👎</button>
            </div>
        </div>
        
        <div class="feedback-box hidden" id="feedback-thanks">
            <div class="feedback-thanks" id="feedback-thanks-text"></div>
        </div>
    </div>
    
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-title" id="settings-title"></div>
            <button type="button" class="btn-setting danger" id="forget-memory-btn"></button>
            <button type="button" class="btn-setting" id="close-settings-btn"></button>
        </div>
    </div>
    
    <script>
        const ELDER_PROFILE_KEY = 'metapelet_elder_profile';
        const GREETING_TRIGGER = '__greeting__';
        const PILOT_SESSION_KEY = 'metapelet_pilot_session_id';
        const PILOT_FEEDBACK_DONE_KEY = 'metapelet_pilot_feedback_done';
        const TRAFFIC_SOURCE_KEY = 'metapelet_traffic_source';
        const TRAFFIC_CONVERSATION_RECORDED_KEY = 'metapelet_traffic_conversation_recorded';
        
        let profile = null;
        let dialogActive = false;
        let isSpeaking = false;
        let awaitingReply = false;
        let recognition = null;
        let lastReplyText = '';
        let lastAudioBlob = null;
        let lastAudioObjectUrl = null;
        let userId = null;
        let mpAudio = null;
        let conversationCount = 0;
        let feedbackShown = false;
        let trafficConversationRecorded = false;
        let realUserMessageSent = false;
        
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        const texts = {
            'ru-RU': {
                noSetup: 'Настройка не завершена',
                goToSetup: 'Перейти к настройке',
                greeting: (name) => `Привет, ${name}!`,
                tapToTalk: 'Поговорить',
                tapToStop: 'Остановить',
                listening: 'Слушаю...',
                thinking: 'Думаю...',
                speaking: 'Говорю...',
                micError: 'Микрофон недоступен',
                micErrorDetail: 'Разрешите доступ к микрофону в настройках браузера',
                networkError: 'Нет связи с сервером',
                tryAgain: 'Попробовать снова',
                notHeard: 'Не слышно?',
                tapToRepeat: 'Нажмите, чтобы повторить',
                limitReached: 'На сегодня лимит бесплатного тестирования исчерпан. Возвращайтесь завтра.',
                unknownError: 'Что-то пошло не так. Попробуйте снова.',
                feedbackQuestion: 'Понравилось?',
                feedbackThanks: 'Спасибо!',
                settingsTitle: 'Настройки',
                forgetMemory: 'Стереть память',
                forgetConfirm: 'Удалить все воспоминания о прошлых разговорах?',
                memoryDeleted: 'Память удалена',
                closeSettings: 'Закрыть'
            },
            'he-IL': {
                noSetup: 'ההגדרה לא הושלמה',
                goToSetup: 'עבור להגדרות',
                greeting: (name) => `!שלום, ${name}`,
                tapToTalk: 'לדבר',
                tapToStop: 'עצור',
                listening: '...מאזין',
                thinking: '...חושב',
                speaking: '...מדבר',
                micError: 'המיקרופון לא זמין',
                micErrorDetail: 'אפשר גישה למיקרופון בהגדרות הדפדפן',
                networkError: 'אין חיבור לשרת',
                tryAgain: 'נסה שוב',
                notHeard: '?לא שומע',
                tapToRepeat: 'לחץ לחזרה',
                limitReached: '.מכסת הבדיקה החינמית להיום הסתיימה. חזור מחר',
                unknownError: '.משהו השתבש. נסה שוב',
                feedbackQuestion: '?נהנית',
                feedbackThanks: '!תודה',
                settingsTitle: 'הגדרות',
                forgetMemory: 'מחק זיכרון',
                forgetConfirm: '?למחוק את כל הזיכרונות משיחות קודמות',
                memoryDeleted: 'הזיכרון נמחק',
                closeSettings: 'סגור'
            },
            'en-US': {
                noSetup: 'Setup not complete',
                goToSetup: 'Go to setup',
                greeting: (name) => `Hello, ${name}!`,
                tapToTalk: 'Talk',
                tapToStop: 'Stop',
                listening: 'Listening...',
                thinking: 'Thinking...',
                speaking: 'Speaking...',
                micError: 'Microphone unavailable',
                micErrorDetail: 'Allow microphone access in browser settings',
                networkError: 'No connection to server',
                tryAgain: 'Try again',
                notHeard: 'Can\'t hear?',
                tapToRepeat: 'Tap to repeat',
                limitReached: 'Today\'s free testing limit has been reached. Please come back tomorrow.',
                unknownError: 'Something went wrong. Try again.',
                feedbackQuestion: 'Did you like it?',
                feedbackThanks: 'Thank you!',
                settingsTitle: 'Settings',
                forgetMemory: 'Forget Memory',
                forgetConfirm: 'Delete all memories from past conversations?',
                memoryDeleted: 'Memory deleted',
                closeSettings: 'Close'
            }
        };
        
        function getPilotSessionId() {
            let id = localStorage.getItem(PILOT_SESSION_KEY);
            if (!id) {
                id = 'ps_' + (window.crypto && crypto.randomUUID
                    ? crypto.randomUUID()
                    : Math.random().toString(36).slice(2, 12));
                localStorage.setItem(PILOT_SESSION_KEY, id);
            }
            return id;
        }
        
        const TRAFFIC_VISIT_RECORDED_KEY = 'metapelet_traffic_visit_recorded';
        
        function captureTrafficSource() {
            try {
                const p = new URLSearchParams(window.location.search);
                const from = p.get("from") || "";
                
                if (!from) return;
                
                // Skip tracking for test sessions
                const sessionId = getPilotSessionId();
                if (sessionId.startsWith("ps_TEST_")) return;
                
                // Store the source
                localStorage.setItem(TRAFFIC_SOURCE_KEY, from);
                
                // Record visit if not already recorded for this source
                const recorded = localStorage.getItem(TRAFFIC_VISIT_RECORDED_KEY);
                if (recorded !== from) {
                    recordTrafficVisit(from, sessionId);
                    localStorage.setItem(TRAFFIC_VISIT_RECORDED_KEY, from);
                }
            } catch (e) {
                console.warn('traffic capture error', e);
            }
        }
        
        function getTrafficSource() {
            try {
                return localStorage.getItem(TRAFFIC_SOURCE_KEY) || "";
            } catch (e) {
                return "";
            }
        }
        
        async function recordTrafficVisit(source, sessionId) {
            try {
                await fetch('/traffic/visit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        source: source,
                        session_id: sessionId
                    })
                });
            } catch (e) {
                console.warn('traffic visit', e);
            }
        }
        
        async function recordTrafficConversation(source, sessionId) {
            try {
                await fetch('/traffic/conversation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        source: source,
                        session_id: sessionId
                    })
                });
            } catch (e) {
                console.warn('traffic conversation', e);
            }
        }
        
        function checkAndRecordTrafficConversation() {
            if (trafficConversationRecorded) return;
            
            try {
                const source = getTrafficSource();
                if (!source) return;
                
                // Skip tracking for test sessions
                const sessionId = getPilotSessionId();
                if (sessionId.startsWith("ps_TEST_")) return;
                
                // Check if already recorded for this source
                const recorded = localStorage.getItem(TRAFFIC_CONVERSATION_RECORDED_KEY);
                if (recorded === source) {
                    trafficConversationRecorded = true;
                    return;
                }
                
                // Record it
                recordTrafficConversation(source, sessionId);
                localStorage.setItem(TRAFFIC_CONVERSATION_RECORDED_KEY, source);
                trafficConversationRecorded = true;
            } catch (e) {
                console.warn('traffic conversation error', e);
            }
        }
        
        async function pilotEvent(name, meta) {
            try {
                await fetch('/pilot/event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: getPilotSessionId(),
                        event: name,
                        utm_source: '',
                        utm_campaign: '',
                        utm_content: '',
                        meta: meta || {}
                    })
                });
            } catch (e) {
                console.warn('pilot event', name, e);
            }
        }
        
        function showFeedbackPrompt() {
            if (feedbackShown || localStorage.getItem(PILOT_FEEDBACK_DONE_KEY)) {
                return;
            }
            feedbackShown = true;
            document.getElementById('feedback-question').textContent = t('feedbackQuestion');
            document.getElementById('feedback-box').classList.add('visible');
        }
        
        async function submitFeedback(liked) {
            document.getElementById('feedback-box').classList.remove('visible');
            
            const payload = {
                session_id: getPilotSessionId(),
                comfortable: '',  // not asked on /talk
                liked: liked ? 'yes' : 'no',
                continue_pilot: '',  // not asked on /talk
                issues: '',
                language: profile.language || '',
                utm_source: '',
                utm_campaign: '',
                utm_content: ''
            };
            
            // Try submission with automatic retry
            let lastError = null;
            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    const resp = await fetch('/pilot/feedback', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        localStorage.setItem(PILOT_FEEDBACK_DONE_KEY, '1');
                        document.getElementById('feedback-thanks-text').textContent = t('feedbackThanks');
                        document.getElementById('feedback-thanks').classList.remove('hidden');
                        setTimeout(() => {
                            document.getElementById('feedback-thanks').classList.add('hidden');
                        }, 3000);
                        return;
                    }
                    lastError = new Error(`HTTP ${resp.status}`);
                } catch (e) {
                    lastError = e;
                    console.error(`feedback attempt ${attempt}:`, e);
                }
                
                if (attempt < 2) {
                    // Wait 1 second before retry
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
            }
            
            // Both attempts failed - show feedback box again to allow retry
            console.error('feedback failed after 2 attempts:', lastError);
            document.getElementById('feedback-box').classList.add('visible');
        }
        
        function loadProfile() {
            const data = localStorage.getItem(ELDER_PROFILE_KEY);
            if (!data) return null;
            try {
                return JSON.parse(data);
            } catch (e) {
                return null;
            }
        }
        
        function getUserId() {
            let id = localStorage.getItem('metapelet_user_id');
            if (!id) {
                id = 'elder_' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('metapelet_user_id', id);
            }
            return id;
        }
        
        function t(key, ...args) {
            const lang = profile?.language || 'ru-RU';
            const text = texts[lang]?.[key] || texts['ru-RU'][key];
            return typeof text === 'function' ? text(...args) : text;
        }
        
        function setLanguage(lang) {
            const dirMap = { 'ru-RU': 'ltr', 'he-IL': 'rtl', 'en-US': 'ltr' };
            const htmlEl = document.getElementById('talk-html');
            htmlEl.setAttribute('dir', dirMap[lang] || 'ltr');
            document.body.setAttribute('dir', dirMap[lang] || 'ltr');
        }
        
        function showError(message, showRetry = false) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('retry-btn').textContent = t('tryAgain');
            document.getElementById('error-container').classList.remove('hidden');
            if (!showRetry) {
                document.getElementById('retry-btn').classList.add('hidden');
            }
        }
        
        function hideError() {
            document.getElementById('error-container').classList.add('hidden');
        }
        
        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }
        
        function showReply(text) {
            const box = document.getElementById('reply-box');
            if (!text) {
                box.classList.remove('visible');
                lastReplyText = '';
                return;
            }
            lastReplyText = text;
            box.textContent = text;
            box.classList.add('visible');
        }
        
        function showReplayButton() {
            const btn = document.getElementById('replay-btn');
            btn.textContent = t('tapToRepeat');
            btn.classList.add('visible');
        }
        
        function hideReplayButton() {
            document.getElementById('replay-btn').classList.remove('visible');
        }
        
        function updateTalkButton() {
            const btn = document.getElementById('talk-btn');
            if (dialogActive) {
                btn.textContent = t('tapToStop');
                btn.classList.add('btn-stop');
            } else {
                btn.textContent = t('tapToTalk');
                btn.classList.remove('btn-stop');
            }
        }
        
        function getAudioEl() {
            if (!mpAudio) {
                mpAudio = new Audio();
                mpAudio.playsInline = true;
                mpAudio.setAttribute('playsinline', '');
                mpAudio.preload = 'auto';
            }
            return mpAudio;
        }
        
        function unlockAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC && !window.__mpAudioCtx) {
                    window.__mpAudioCtx = new AC();
                }
                if (window.__mpAudioCtx) {
                    window.__mpAudioCtx.resume();
                }
                const a = getAudioEl();
                a.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkZXNjYAA=';
                a.volume = 1.0;
                a.play().then(() => {
                    window.__mpAudioUnlocked = true;
                }).catch(() => {});
            } catch (e) {
                console.warn('Audio unlock:', e);
            }
        }
        
        async function playAudioBlob(blob, onEnd) {
            if (lastAudioObjectUrl) {
                URL.revokeObjectURL(lastAudioObjectUrl);
            }
            lastAudioObjectUrl = URL.createObjectURL(blob);
            const audio = getAudioEl();
            let settled = false;
            
            function fail() {
                if (settled) return;
                settled = true;
                isSpeaking = false;
                showReplayButton();
                setStatus('');
                if (onEnd) onEnd();
            }
            
            audio.onended = () => {
                if (settled) return;
                settled = true;
                isSpeaking = false;
                setStatus('');
                if (onEnd) onEnd();
            };
            
            audio.onerror = fail;
            audio.src = lastAudioObjectUrl;
            
            try {
                await audio.play();
            } catch (err) {
                fail();
            }
        }
        
        async function speakReply(text, onEnd) {
            if (!text) {
                if (onEnd) onEnd();
                return;
            }
            isSpeaking = true;
            setStatus(t('speaking'));
            unlockAudio();
            
            try {
                const resp = await fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text, 
                        language: profile.language 
                    })
                });
                
                if (resp.status === 429) {
                    isSpeaking = false;
                    showReplayButton();
                    setStatus('');
                    if (onEnd) onEnd();
                    return;
                }
                
                if (!resp.ok) throw new Error('TTS unavailable');
                
                const blob = await resp.blob();
                lastAudioBlob = blob;
                await playAudioBlob(blob, onEnd);
            } catch (e) {
                isSpeaking = false;
                showReplayButton();
                setStatus('');
                if (onEnd) onEnd();
            }
        }
        
        function playReplyManually() {
            if (!lastReplyText) return;
            unlockAudio();
            hideReplayButton();
            if (lastAudioBlob) {
                playAudioBlob(lastAudioBlob, () => {
                    if (dialogActive) startListening();
                });
            }
        }
        
        function stopListening() {
            if (recognition) {
                try { recognition.abort(); } catch (e) {}
                recognition = null;
            }
        }
        
        function startListening() {
            if (isSpeaking || awaitingReply) return;
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showError(t('micError') + '. ' + t('micErrorDetail'));
                return;
            }
            
            if (recognition) return;
            
            const rec = new SpeechRecognition();
            recognition = rec;
            rec.lang = profile.language;
            rec.interimResults = false;
            rec.continuous = false;
            rec.maxAlternatives = 1;
            rec._gotResult = false;
            
            setStatus(t('listening'));
            hideError();
            
            rec.onresult = async (event) => {
                const userMessage = (event.results[0][0].transcript || '').trim();
                if (!userMessage) return;
                rec._gotResult = true;
                awaitingReply = true;
                if (recognition === rec) recognition = null;
                try { rec.stop(); } catch (e) {}
                await sendMessage(userMessage);
            };
            
            rec.onend = () => {
                if (recognition === rec) recognition = null;
                if (!rec._gotResult && !awaitingReply && dialogActive) {
                    setTimeout(startListening, 500);
                }
            };
            
            rec.onerror = (event) => {
                if (recognition === rec) recognition = null;
                if (event.error === 'not-allowed') {
                    showError(t('micErrorDetail'));
                    stopDialog();
                } else if (event.error === 'no-speech') {
                    if (dialogActive && !awaitingReply) {
                        setTimeout(startListening, 1000);
                    }
                } else {
                    console.error('Recognition error:', event.error);
                }
            };
            
            try {
                rec.start();
            } catch (e) {
                console.error('Recognition start failed:', e);
                if (recognition === rec) recognition = null;
            }
        }
        
        async function sendMessage(message, isGreeting = false) {
            awaitingReply = true;
            hideReplayButton();
            setStatus(t('thinking'));
            stopListening();
            
            const payload = {
                message: message,
                user_id: userId,
                name: profile.name,
                age: profile.age || '',
                language: profile.language,
                interests: '',
                avoid_topics: ''
            };
            
            try {
                const resp = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (resp.status === 429) {
                    const data = await resp.json().catch(() => ({}));
                    showReply(data.reply || t('limitReached'));
                    stopDialog();
                    return;
                }
                
                if (!resp.ok) throw new Error('Server error');
                
                const data = await resp.json();
                awaitingReply = false;
                
                // Track conversations for pilot (first message, greeting or real)
                conversationCount++;
                if (conversationCount === 1) {
                    pilotEvent('conversation');
                }
                
                // Track traffic conversation only on first real user message (not greeting)
                if (!isGreeting && !realUserMessageSent) {
                    realUserMessageSent = true;
                    checkAndRecordTrafficConversation();
                }
                
                showReply(data.reply);
                await speakReply(data.reply, () => {
                    if (dialogActive) startListening();
                });
            } catch (err) {
                awaitingReply = false;
                console.error('Chat error:', err);
                showError(t('networkError'), true);
            }
        }
        
        function startDialog() {
            dialogActive = true;
            updateTalkButton();
            unlockAudio();
            hideError();
            pilotEvent('voice_started');
            sendMessage(GREETING_TRIGGER, true);
        }
        
        function stopDialog() {
            dialogActive = false;
            isSpeaking = false;
            awaitingReply = false;
            updateTalkButton();
            setStatus('');
            stopListening();
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            // Show feedback prompt after stopping if they had a conversation
            if (conversationCount > 0) {
                setTimeout(showFeedbackPrompt, 500);
            }
        }
        
        function toggleDialog() {
            if (dialogActive) {
                stopDialog();
            } else {
                startDialog();
            }
        }
        
        // Event listeners
        document.getElementById('talk-btn').addEventListener('click', toggleDialog);
        document.getElementById('replay-btn').addEventListener('click', playReplyManually);
        document.getElementById('retry-btn').addEventListener('click', () => {
            hideError();
            if (dialogActive) {
                startListening();
            } else {
                startDialog();
            }
        });
        document.getElementById('feedback-yes').addEventListener('click', () => submitFeedback(true));
        document.getElementById('feedback-no').addEventListener('click', () => submitFeedback(false));
        
        // Settings modal functions
        function showSettingsModal() {
            document.getElementById('settings-title').textContent = t('settingsTitle');
            document.getElementById('forget-memory-btn').textContent = t('forgetMemory');
            document.getElementById('close-settings-btn').textContent = t('closeSettings');
            document.getElementById('settings-modal').classList.add('visible');
        }
        
        function hideSettingsModal() {
            document.getElementById('settings-modal').classList.remove('visible');
        }
        
        async function forgetMemory() {
            if (!confirm(t('forgetConfirm'))) {
                return;
            }
            
            try {
                const resp = await fetch('/memory/forget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                
                if (resp.ok) {
                    alert(t('memoryDeleted'));
                    hideSettingsModal();
                } else {
                    alert(t('unknownError'));
                }
            } catch (e) {
                console.error('Forget memory error:', e);
                alert(t('networkError'));
            }
        }
        
        // Long press on settings button
        let settingsLongPressTimer = null;
        document.getElementById('settings-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            settingsLongPressTimer = setTimeout(() => {
                showSettingsModal();
            }, 2000);
        });
        document.getElementById('settings-btn').addEventListener('touchend', () => {
            if (settingsLongPressTimer) {
                clearTimeout(settingsLongPressTimer);
                settingsLongPressTimer = null;
            }
        });
        document.getElementById('settings-btn').addEventListener('click', () => {
            showSettingsModal();
        });
        
        document.getElementById('forget-memory-btn').addEventListener('click', forgetMemory);
        document.getElementById('close-settings-btn').addEventListener('click', hideSettingsModal);
        
        // Initialize
        captureTrafficSource();
        
        profile = loadProfile();
        if (!profile || !profile.setupComplete) {
            showError(t('noSetup'));
            document.getElementById('retry-btn').textContent = t('goToSetup');
            document.getElementById('retry-btn').classList.remove('hidden');
            document.getElementById('retry-btn').addEventListener('click', () => {
                window.location.href = '/setup';
            });
            document.getElementById('talk-btn').classList.add('hidden');
        } else {
            userId = getUserId();
            setLanguage(profile.language);
            document.getElementById('greeting').textContent = t('greeting', profile.name);
            updateTalkButton();
            
            // Auto-start conversation after a brief delay
            setTimeout(() => {
                if (!dialogActive) startDialog();
            }, 800);
        }
        
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(err => {
                console.warn('Service worker registration failed:', err);
            });
        }
    </script>
</body>
</html>
